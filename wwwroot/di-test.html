<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OM Document Intelligence Test</title>
</head>
<body>
    <h2>OM Document Intelligence Test</h2>

    <p>Select one authorised/redacted driver licence or passport.</p>

    <p>
        Expected applicant name:
        <input id="expectedName"
               type="text"
               placeholder="First name Last name">
    </p>

    <input id="file"
           type="file"
           accept=".pdf,.jpg,.jpeg,.png">

    <button id="testButton">Run test</button>

    <pre id="result"></pre>

    <hr>

<h2>Australian Payslip Test</h2>

<p>Upload one authorised/redacted Australian payslip.</p>

<input id="payslipFile"
       type="file"
       accept=".pdf,.jpg,.jpeg,.png">

<button id="payslipButton">
    Run payslip test
</button>

<pre id="payslipResult"></pre>

    <script>
        const button = document.getElementById("testButton");
        const fileInput = document.getElementById("file");
        const expectedNameInput =
            document.getElementById("expectedName");
        const result = document.getElementById("result");

        button.addEventListener("click", async () => {
            const file = fileInput.files[0];
            const expectedName =
                expectedNameInput.value.trim();

            if (!expectedName) {
                result.textContent =
                    "Please enter the expected applicant name.";
                return;
            }

            if (!file) {
                result.textContent =
                    "Please select a file.";
                return;
            }

            if (file.size > 4 * 1024 * 1024) {
                result.textContent =
                    "File is over the 4 MB pilot limit.";
                return;
            }

            const data = new FormData();
            data.append("file", file);
            data.append(
                "expectedApplicantName",
                expectedName);

            result.textContent = "Analyzing...";

            try {
                const response = await fetch(
                    "/api/document-intelligence/test",
                    {
                        method: "POST",
                        body: data
                    });

                const text = await response.text();

                result.textContent =
                    "HTTP " + response.status +
                    "\n\n" + text;
            }
            catch (error) {
                result.textContent =
                    "Request failed: " + error;
            }
        });
        const payslipButton =
    document.getElementById("payslipButton");

const payslipFile =
    document.getElementById("payslipFile");

const payslipResult =
    document.getElementById("payslipResult");

payslipButton.addEventListener("click", async () => {
    const file = payslipFile.files[0];

    if (!file) {
        payslipResult.textContent =
            "Please select a payslip.";
        return;
    }

    if (file.size > 4 * 1024 * 1024) {
        payslipResult.textContent =
            "File is over the 4 MB pilot limit.";
        return;
    }

    const data = new FormData();
    data.append("file", file);

    payslipResult.textContent =
        "Analyzing payslip...";

    try {
        const response = await fetch(
            "/api/document-intelligence/payslip-test",
            {
                method: "POST",
                body: data
            });

        const text = await response.text();

        payslipResult.textContent =
            "HTTP " +
            response.status +
            "\n\n" +
            text;
    }
    catch (error) {
        payslipResult.textContent =
            "Request failed: " + error;
    }
});
    </script>
</body>
</html>
